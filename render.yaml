# Render Blueprint — provisions the API and its database from this file.
#
# Render → New → Blueprint → pick this repo. Everything below is created for you;
# only the secrets marked `sync: false` need typing, and Render prompts for them.
#
# Region: Singapore is Render's closest to India. Change `region` in BOTH places
# together — a web service and database in different regions lose the private
# network and fall back to a slower, publicly-reachable connection.

databases:
  - name: sapien-db
    databaseName: sapien
    user: sapien
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: sapien-api
    runtime: python
    rootDir: apps/api
    region: singapore

    # NEVER a plan that sleeps (D23). A cold start means a reader taps a WhatsApp
    # link and stares at a blank screen for the better part of a minute. This is a
    # product decision, not a cost one.
    plan: starter

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 120

    healthCheckPath: /api/health

    envVars:
      # ── wired automatically ────────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: sapien-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: "3.13"

      - key: DJANGO_DEBUG
        value: "false"

      - key: DATABASE_SSL_REQUIRE
        value: "false"        # private network inside one region; no SSL needed

      # ── set these once the domain exists ───────────────────────────────
      # Until then the API answers on <service>.onrender.com and the health
      # check works. Sessions across two subdomains need the real domain, so
      # COOKIE_DOMAIN stays empty until DNS is pointed.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false           # api.<domain>,sapien-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # https://app.<domain>
      - key: CSRF_TRUSTED_ORIGINS
        sync: false           # https://app.<domain>
      - key: COOKIE_DOMAIN
        sync: false           # .<domain>  — leading dot matters
      - key: APP_BASE_URL
        sync: false           # https://app.<domain>

      # ── secrets, typed once into the dashboard ─────────────────────────
      # Cloudflare R2. THE BUCKET MUST STAY PRIVATE (D19) — nothing here
      # generates a storage URL; the API streams the bytes itself.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto

      # Twilio. Leave unset and delivery falls back to printing on screen —
      # the app runs fine without it, which is how it stays deployable before
      # the WhatsApp templates clear Meta review.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

      # The companion. Unset means chat is unavailable; nothing else changes.
      - key: ANTHROPIC_API_KEY
        sync: false
