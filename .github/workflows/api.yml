name: api

# Path-filtered so a frontend-only PR doesn't run this (D6). `shared/` is included
# because both apps read it — a change there can break either side.
on:
  push:
    branches: [main]
    paths: ["apps/api/**", "shared/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", "shared/**", ".github/workflows/api.yml"]

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - run: pip install -r requirements.txt

      # No credentials, no network, no Postgres. Mandate 6: a fresh clone runs with
      # zero credentials, and CI is the thing that keeps that true.
      - name: Check
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python manage.py test core
